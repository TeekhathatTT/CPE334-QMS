version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: qms-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qms_db
    ports:
      - "5432:5432"
    volumes:
      - qms_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  qms_postgres_data:

